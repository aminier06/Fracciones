<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Fracciones</title>

<style>
:root{
  --rod-height:44px;
}
body{font-family:Arial;margin:0;background:#f6f8fb;}
.layout{display:grid;grid-template-columns:1fr 420px;padding:16px;gap:16px;}
.board{position:relative;height:600px;background:#fff;border:1px dashed #ccc;}
.panel{background:#fff;padding:12px;border:1px solid #ccc;}

.piece{position:absolute;cursor:grab;}
.rod{height:var(--rod-height);border:1px solid #000;}
.circle{width:120px;height:120px;border-radius:50%;border:2px solid #000;}

.group-label{
  position:absolute;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.bar{width:20px;height:2px;background:#000;margin:2px 0;}
</style>
</head>

<body>

<div class="layout">

<div class="board" id="board"></div>

<div class="panel">
<button onclick="clearBoard()">Limpiar tablero</button>
<label>
<input type="checkbox" id="toggleLabels" checked>
Mostrar etiquetas
</label>

<h3>Regletas</h3>
<button onclick="addRod(1,4)">1/4</button>
<button onclick="addRod(1,2)">1/2</button>

<h3>Círculos</h3>
<button onclick="addCircle(1,4)">1/4</button>
<button onclick="addCircle(1,2)">1/2</button>
</div>

</div>

<footer id="copyright"></footer>

<script>
const board=document.getElementById("board");
let selected=null;

function addRod(n,d){
  const rod=document.createElement("div");
  rod.className="piece rod";
  rod.dataset.n=n;
  rod.dataset.d=d;
  rod.style.width=(800/d)+"px";
  rod.style.left="20px";
  rod.style.top="50px";
  attach(rod);
  board.appendChild(rod);
  updateGroups();
}

function addCircle(n,d){
  const c=document.createElement("div");
  c.className="piece circle";
  c.dataset.n=n;
  c.dataset.d=d;
  c.style.left="20px";
  c.style.top="200px";
  c.style.background="rgba(0,0,255,0.3)";
  attach(c);
  board.appendChild(c);
}

function attach(el){
  el.onpointerdown=e=>{
    selected=el;
    const startX=e.clientX;
    const startY=e.clientY;
    const left=parseFloat(el.style.left);
    const top=parseFloat(el.style.top);

    document.onpointermove=ev=>{
      el.style.left=(left+ev.clientX-startX)+"px";
      el.style.top=(top+ev.clientY-startY)+"px";
    };

    document.onpointerup=()=>{
      document.onpointermove=null;
      updateGroups();
    };
  };

  el.ondblclick=()=>el.remove();
}

function clearBoard(){
  board.innerHTML="";
}

function updateGroups(){
  document.querySelectorAll(".group-label").forEach(e=>e.remove());

  const rods=[...document.querySelectorAll(".rod")];

  rods.forEach(r=>{
    const d=r.dataset.d;
    const group=rods.filter(x=>x.dataset.d===d);

    if(group.length>1){
      let left=Math.min(...group.map(g=>parseFloat(g.style.left)));
      let right=Math.max(...group.map(g=>parseFloat(g.style.left)+g.offsetWidth));
      let top=parseFloat(group[0].style.top);

      let total=group.length;

      const label=document.createElement("div");
      label.className="group-label";
      label.style.left=left+"px";
      label.style.top=top+"px";
      label.style.width=(right-left)+"px";

      label.innerHTML=`
        <span>${total}</span>
        <div class="bar"></div>
        <span>${d}</span>
      `;

      if(document.getElementById("toggleLabels").checked){
        board.appendChild(label);
      }
    }
  });
}

document.getElementById("toggleLabels").onchange=updateGroups;

document.getElementById("copyright").innerHTML=
"© "+new Date().getFullYear()+" Aneudy Minier";

</script>

</body>
</html>
